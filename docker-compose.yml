version: '3.8'

services:
  # === PostgreSQL (Relational Data) ===
  postgres:
    image: postgres:16-alpine
    container_name: coresearcher-postgres
    environment:
      POSTGRES_DB: coresearcher
      POSTGRES_USER: coresearcher
      POSTGRES_PASSWORD: coresearcher_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - coresearcher-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coresearcher"]
      interval: 10s
      timeout: 5s
      retries: 5

  # === Neo4j (Knowledge Graph) ===
  neo4j:
    image: neo4j:5-community
    container_name: coresearcher-neo4j
    environment:
      NEO4J_AUTH: neo4j/coresearcher_dev
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*,gds.*
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - ./scripts/neo4j-schema.cypher:/import/schema.cypher:ro
    networks:
      - coresearcher-net
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "coresearcher_dev", "RETURN 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  # === Redis (Queues & Cache) ===
  redis:
    image: redis:7-alpine
    container_name: coresearcher-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - coresearcher-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # === MCP Server (CoResearcher Core) ===
  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
      target: mcp-server
    container_name: coresearcher-mcp
    ports:
      - "3100:3100"
    environment:
      NODE_ENV: production
      MCP_TRANSPORT: sse
      MCP_PORT: 3100
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: coresearcher_dev
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://coresearcher:coresearcher_dev@postgres:5432/coresearcher
    depends_on:
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - coresearcher-net

volumes:
  postgres_data:
  neo4j_data:
  redis_data:

networks:
  coresearcher-net:
    driver: bridge