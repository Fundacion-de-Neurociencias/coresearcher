# Registro Canónico de Identidades Digitales de NeuroOS (NEUROOS IDENTITY REGISTRY)
$schema: "http://json-schema.org/draft-07/schema#"
version: "1.0.0"
governance: "Identity-Centric Access Architecture"
status: "Canonical Reference"

description: >
  Especificación de las Identidades Digitales soberanas de Manuel a través de las cuales 
  cuelgan los 500+ servicios, cuentas, portales, repositorios y credenciales del ecosistema.

identity_architecture:
  root_owner: "Manuel (Persona Física)"
  vault_sync_provider: "Bitwarden Organizations & Collections / Infisical"
  auto_discovery: true # NeuroOS descubre servicios dinámicamente desde el Vault

identities:

  # 1. Identidad Personal & Familiar
  Manuel_Personal:
    name: "Identidad Personal y Familiar"
    owner: "Manuel"
    default_zone: "CONTROLLED_HIGH"
    services:
      - "gmail_personal"
      - "google_calendar_personal"
      - "bancos_santander_bbva_openbank"
      - "etoro_inversiones"
      - "historia_clinica_familiar"
      - "booking_renfe_viajes"
    authentication:
      - "master_password"
      - "mfa_yubikey"
    delegation_policy: "Requires Human Approval for financial/medical actions"

  # 2. Identidad Universidad de Oviedo
  Universidad_Oviedo:
    name: "Identidad Académica Universidad de Oviedo"
    owner: "Manuel"
    default_zone: "CONTROLLED_HIGH"
    services:
      - "correo_uniovi"
      - "intranet_uniovi"
      - "campus_virtual_uniovi"
      - "actas_y_docencia"
    authentication:
      - "sso_uniovi"
      - "mfa"
    executors:
      - "ManuEl"
      - "Antigravity (Solo borradores y material docente)"

  # 3. Identidad HUCA / Neurología (Acceso Directo Prohibido a Agentes)
  HUCA_Neurologia:
    name: "Identidad Hospitalaria HUCA - Servicio de Neurología"
    owner: "Manuel"
    default_zone: "BLACK" # La actividad se gestiona, pero el agente NO entra en la intranet
    allow_model_processing: false
    delegable: false
    broker_access: false
    services:
      - "intranet_huca_clinical"
      - "correo_huca"
      - "historias_clinicas_pacientes"
    executors:
      - "Manuel (Exclusivo Persona Física)"
    note: "NeuroOS gestiona la actividad y tareas asociadas, pero NO ingresa a la red/sistema del hospital."

  # 4. Identidad ISPA / FINBA (Investigación Sanitaria)
  ISPA_FINBA:
    name: "Identidad de Investigación ISPA - FINBA"
    owner: "Manuel"
    default_zone: "CONTROLLED_HIGH"
    services:
      - "portal_investigador_ispa"
      - "gestion_proyectos_finba"
      - "subvenciones_europeas_erc"
    authentication:
      - "certificados_o_credenciales_dedicadas"

  # 5. Identidad Fundación de Neurociencias
  Fundacion_Neurociencias:
    name: "Identidad Institucional Fundación de Neurociencias"
    owner: "Manuel"
    default_zone: "CONTROLLED_HIGH"
    services:
      - "gmail_fundacion"
      - "web_fundacion"
      - "stripe_fundacion_donaciones"
      - "convenios_y_acuerdos"
    executors:
      - "Antigravity (Preparación de borradores y publicaciones)"
      - "ManuEl (Control de Aprobación)"

  # 6. Identidad Administración Pública & Ciudadanía
  Administracion_Publica:
    name: "Identidad Legal Ciudadana"
    owner: "Manuel"
    default_zone: "CRITICAL"
    allow_model_processing: false
    services:
      - "aeat_hacienda"
      - "seguridad_social"
      - "sistema_clave"
      - "catastro_tramites"
    authentication:
      - "dni_electronico"
      - "fnmt_yubikey"
    executors:
      - "Manuel (Ejecución y Firma Directa)"

  # 7. Identidad Proyectos & Ecosistema Técnico (Zona AUTONOMOUS)
  Ecosistema_Desarrollo:
    name: "Identidad de Desarrollo & Proyectos Abiertos"
    owner: "Manuel"
    default_zone: "AUTONOMOUS"
    services:
      - "github_medicalia"
      - "github_coresearcher"
      - "github_editxt"
      - "github_geneforge"
      - "github_neurodiagnoses"
      - "github_pharmaoracle"
      - "vercel_deployments"
    executors:
      - "Antigravity (CTO Distribuido 100% Autónomo)"
