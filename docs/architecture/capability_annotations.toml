# Hand-written half of the capability map (docs/architecture/CAPABILITY_MAP.md).
#
# scripts/generate_capability_map.py reads the code for everything it can: endpoints, CLI commands, module maturity,
# ADR references and tests. This file holds what code cannot say: which pieces form one capability, what that
# capability does in plain words, its role in the verification chain (ADR-085) and its honest caveats.
#
# Rules enforced by `python scripts/generate_capability_map.py --check` (CI, repo-consistency job):
# - every endpoint, CLI command, module under python/ and api/, file under scripts/ (not scripts/archive/), and entry
#   under examples/, benchmarks/ and integrations/<name>/ matches exactly one capability below;
# - every pattern matches at least one of them (no stale annotations);
# - every ADR listed under `adrs` exists in docs/decisions/.
# Patterns are shell-style (fnmatch): `*` also matches `/`.
#
# Caveats on the older engines restate the functional review of 2026-10-17 (branch docs/capability-map), re-checked
# against the code on 2026-11-02, and the status column of docs/reference/CLAIMS_REGISTER.md.

overview = """
## In plain words

CoResearcher checks scientific claims; it does not invent them. You give it a hypothesis (in prose, or written as
explicit variables and constraints), and it tells you, with reasons that anyone can re-run:

- whether the hypothesis says anything at all, or could never be proved wrong;
- whether its own assumptions contradict each other;
- which situations would prove it wrong;
- how it relates to rival hypotheses, and what follows from it;
- whether the results it borrows from other papers are used under the conditions those papers proved them;
- how far each claim has really been checked, from "only written down" to "checked by a proof assistant".

When CoResearcher cannot decide something, it says so ("open", "blocked", "undecided") instead of guessing. Around
these checks it keeps tamper-evident records: what was fixed in advance, which results depend on which premises, and
which stage of a research project has passed its gate.

The repository also holds many engines from earlier phases of the project (2025 to mid-2026). Some still compute
something real; many return scripted results, match keywords, or apply a fixed threshold to numbers the caller
supplies. They are listed here with those caveats, so nobody mistakes them for working science. The parts that carry
the product today are the formal core, the verification chain, the statement and manuscript audits, the registry
and ledgers, the biomedical checks, the regression benchmarks and the research lifecycle.
"""

reading_guide = """
Each capability lists:

- **What it does**, in plain words, and a **status** line where the capability is legacy, scripted or withdrawn.
- **Verification chain (ADR-085)**: the step it performs in the composed chain (`POST /api/chain/run`,
  `coresearcher chain run`), if any. The chain runs freeze, formalize, fidelity, vacuity, obligations, seams,
  discharge and trust ladder, in that order ([VERIFICATION_METHODOLOGY.md](VERIFICATION_METHODOLOGY.md), section 3).
- **Caveats**: scripted demos, keyword heuristics, thresholds on caller-supplied numbers, withdrawn or unvalidated
  benchmarks. A capability without caveats can still be wrong; the [claims register](../reference/CLAIMS_REGISTER.md)
  says what has been measured.
- **Modules**, with the maturity level from the [module register](../reference/MODULE_MATURITY.md) (integrated,
  tested, exercised, prototype; modules outside `python/discovery/` are outside that register) and the number of
  endpoints whose code refers to the module directly. The register marks a module as API-reachable only when its name
  appears under `api/`; routers that import classes through `python.discovery` re-exports are missed, so the endpoint
  count here is the better measure of reach.
- **Endpoints** and **CLI** commands, read from the code. The [API reference](../reference/API.md) has the schemas.
- **ADRs** cited by the capability's own source files, and **tests** that mention its modules, scripts or paths.
"""

maintenance = """
`scripts/generate_capability_map.py` rebuilds this page and
[`ecosystem/registry/capabilities.json`](../../ecosystem/registry/capabilities.json) from the code and from
[`capability_annotations.toml`](capability_annotations.toml). CI runs it with `--check` in the repo-consistency job.
The check fails when:

- an endpoint, CLI command, module, script, example, benchmark file or integration entry belongs to no capability,
  or to more than one;
- an annotation pattern matches nothing (the code it described is gone);
- the AST scan of `api/` and the committed OpenAPI contract disagree;
- this page or the registry file differs from what the generator writes.

`tests/test_capability_map.py` checks that the endpoints of `GET /api/capabilities` (the runtime catalogue, ADR-067)
are exactly the endpoints of the registry, and that both report the same maturity for each module.

To add a capability: write the code, add an entry to the annotations file (id, title, group, what, the patterns that
claim its files, endpoints and commands, and its caveats), run `python scripts/generate_capability_map.py`, and
commit the three files together.
"""

# --------------------------------------------------------------------------------------------- groups

[[group]]
id = "formal-core"
title = "Formal core"
intro = """
Hypotheses as formal objects: variables, constraints and claims over a declared state space, decided exactly by
enumeration or by the z3 solver, with explicit non-verdicts when nothing can be decided. Everything else that checks
a hypothesis builds on this group.
"""

[[group]]
id = "verification-chain"
title = "Verification chain"
intro = """
The eight methods of VERIFICATION_METHODOLOGY.md composed into one flow (ADR-085): fix the acceptance criteria
first, formalize, check fidelity and vacuity, decompose into obligations, check the seams, discharge, and grade every
claim on the trust ladder.
"""

[[group]]
id = "statement-audits"
title = "Statement and manuscript audits"
intro = """
Checks that a formal statement says what the paper claims (statement fidelity, vacuity, junk values in Lean), and
static checks on manuscript sources (unresolved citations, results imported from cited papers).
"""

[[group]]
id = "registry-ledger"
title = "Registry and ledgers"
intro = """
Tamper-evident records: the registry of cited results and premises with dependency propagation (ADR-083), and the
obligation ledger of claimed mathematical results with its machine-checked proof cases (ADR-076).
"""

[[group]]
id = "biomedical"
title = "Biomedical domain"
intro = """
The verification chain applied to biomedical hypotheses (ADR-086): units, a convention vocabulary, domain probes and
mechanistic chains. Also the older biophysics auditors, which are threshold checks and are marked as such.
"""

[[group]]
id = "case-studies"
title = "Case studies"
intro = """
Worked, reproducible audits of real announced results (openai/math papers, the Yang-Mills announcement, the Sakana
ED rubric, Collatz). Each case has a module, a report script and committed outputs under examples/. Their findings
were turned into the capabilities above; the cases remain as evidence and as regression inputs.
"""

[[group]]
id = "discovery-engines"
title = "Discovery engines (earlier phases)"
intro = """
Engines from the 2025 to mid-2026 phases, when CoResearcher aimed at autonomous discovery. Most are reachable over
the API. The functional review of 2026-10-17 read each one: a few compute something real from their input; many
return scripted results, match keywords, or apply fixed thresholds to numbers the caller supplies. None of them is
part of the verification chain. Treat their outputs as demonstrations unless a caveat says otherwise.
"""

[[group]]
id = "observer"
title = "Observer, ledger and provenance"
intro = """
Reconstruction of a project's history from git and publication metadata, the in-memory scientific ledger, Zenodo
publication, and the trajectory-reconstruction scripts of sprints 58 to 60.
"""

[[group]]
id = "ecosystem"
title = "Ecosystem and integrations"
intro = """
Contracts other systems consume: the EvidenceRequest/EvidenceGraph contract for EdiTXT (ADR-067), the capability
catalogue for OnTrack, and the `oase formal` adapter for Google's Open Agentic Science Engine (ADR-069).
"""

[[group]]
id = "benchmarks"
title = "Benchmarks and regression"
intro = """
Measurements of what the capabilities actually catch, and the regression suite that keeps those measurements from
silently changing (ADR-084). Older harnesses whose results were scripted or withdrawn are listed with that status.
"""

[[group]]
id = "infrastructure"
title = "Infrastructure"
intro = """
The API server and its security, the CLI shell, the research lifecycle with its stage gates (ADR-063), portable
research packages (ADR-065), and the generators and checks that keep documentation and contracts in sync with code.
"""

# --------------------------------------------------------------------------------------------- formal core

[[capability]]
id = "formal-hypotheses"
title = "Formal hypotheses and exact evaluation"
group = "formal-core"
what = """
Represents a hypothesis as variables, constraints and claims over a declared state space, and decides questions
about it exactly: whether it forbids anything (falsifiability), whether its assumptions conflict, which states refute
it, how it relates to a rival (equivalent, stronger, weaker, compatible, incompatible) and whether a consequence
follows. Finite spaces are enumerated; continuous and unbounded integer variables go to z3 (ADR-060, ADR-090). Every
result carries a status from a shared vocabulary (decided, open, blocked, undecided, invalid input), named and
versioned thresholds, and a provenance block saying which engine and solver produced it (ADR-068). Hypotheses can be
case-scoped (ADR-089).
"""
chain = """
Step 7, discharge (M8): obligations that are formal consequences are decided here by z3 or enumeration, never turning
an unknown into a verdict. Step 4, vacuity (M4): the evaluator's declared non-witness probe (ADR-080).
"""
caveats = [
  "Verdicts are exact only for the variables and constraints as declared; whether the declaration matches the scientist's intent is the job of the fidelity and formalization checks.",
  "z3 runs under a timeout (formal_thresholds); a timeout is reported as UNDECIDED, never as a verdict.",
]
files = [
  "python/discovery/formal_hypothesis.py",
  "python/discovery/formal_smt.py",
  "python/discovery/formal_status.py",
  "python/discovery/formal_thresholds.py",
  "python/discovery/formal_provenance.py",
]
endpoints = ["POST /api/hypotheses/evaluate", "POST /api/hypotheses/compare", "POST /api/hypotheses/entails"]

[[capability]]
id = "formalizer-gate"
title = "Formalizer and self-consistency gate"
group = "formal-core"
what = """
Turns a hypothesis written in prose into the formal object, using a local language model as a translator only. The
gate draws several independent formalizations and accepts one only when a strict majority are exactly equivalent
(decided by z3 or enumeration); otherwise it returns FORMALIZATION_AMBIGUOUS or FORMALIZATION_FAILED. Accepted
results are drafts pending the scientist's review.
"""
chain = "Step 2, formalize (M2): independent readings that must agree (ADR-064)."
caveats = [
  "Needs a configured local model (OpenAI-compatible endpoint); without one the endpoint reports BLOCKED.",
  "Fidelity of prose-to-formal translation is not established: claims register row 24 is NOT MET on a 20-item exploratory seed set, and the gate keeps unstable formalizations out but lets consistent, systematic errors through (row 29).",
]
files = ["python/discovery/formalizer.py", "python/discovery/formalization_gate.py", "scripts/benchmarks/formalizer_bench.py"]
endpoints = ["POST /api/hypotheses/formalize"]

[[capability]]
id = "formal-pipeline"
title = "Two-phase formal runs with provenance (formal run / analyze)"
group = "formal-core"
what = """
The whole formal layer as one reproducible computation: phase 1 (`formal run`) formalizes if needed, evaluates, and
writes the request, the response and a provenance sidecar; phase 2 (`formal analyze`) re-analyses a stored run
offline and deterministically. `formal doctor` reports whether z3, Lean and the formalizer are available and which
thresholds are in force. The design follows the tool guidance of Google's OASE (ADR-068).
"""
files = ["python/discovery/formal_pipeline.py", "python/cli/formal.py"]
cli = ["formal run", "formal analyze", "formal doctor"]

[[capability]]
id = "lean-export"
title = "Lean 4 export and kernel cross-check"
group = "formal-core"
what = """
States a consequence that z3 has decided as a Lean 4 theorem over the reals, so an independent proof kernel can
re-check it. The offline benchmark script runs the Lean kernel on those theorems on a machine with Mathlib; the setup
scripts provision Lean and the remote Lean oracle machine.
"""
caveats = [
  "The API returns Lean source marked NOT_KERNEL_CHECKED; nothing in the running service calls the Lean kernel. Kernel checks happen only in scripts/benchmarks/formal_lean_check.py on a machine with Mathlib.",
]
files = [
  "python/discovery/formal_lean.py",
  "scripts/benchmarks/formal_lean_check.py",
  "scripts/setup_lean4_environment.py",
  "scripts/benchmarks/legion*",
]

# --------------------------------------------------------------------------------------------- verification chain

[[capability]]
id = "verification-chain"
title = "Composed verification chain"
group = "verification-chain"
what = """
Runs a submitted hypothesis (formal, prose, or a biomedical mechanism) through the eight steps of the methodology in
one call and reports each step's state: DONE, OPEN, NOT_APPLICABLE, NOT_RUN or a non-verdict. A non-verdict stops the
chain, and later steps are NOT_RUN. The final report grades every claim on the trust ladder.
"""
chain = "The chain itself (ADR-085): freeze, formalize, fidelity, vacuity, obligations, seams, discharge, trust ladder."
caveats = [
  "Fidelity stays OPEN unless the scientist supplies a fidelity specification, and vacuity stays OPEN unless non-witnesses are declared: there is no independent formal reading of the prose to compare against.",
  "On the openai/math time-travel corpus the full chain decided 1 of 17 corrected defects, the same unresolved citation the first run found (OPENAI_MATH_CHAIN_RESULTS.md).",
]
files = ["python/discovery/verification_chain.py", "python/cli/chain.py"]
endpoints = ["POST /api/chain/run"]
cli = ["chain run"]

[[capability]]
id = "freeze-service"
title = "Freeze service (acceptance criteria fixed in advance)"
group = "verification-chain"
what = """
Records, before anything is evaluated, what would count as support or refutation: the discriminating states of a
hypothesis against its rivals, or the SHA-256 of a protocol or checklist. A later verification says whether the
freeze still holds for what is about to be evaluated; a mismatch blocks the evaluation. Freezes go to a hash-chained
log and can be anchored in a lifecycle project.
"""
chain = "Step 1, freeze (M3). A freeze made in the same run is reported with the weaker relay CRITERIA_FROZEN_IN_SAME_RUN."
files = ["python/discovery/freeze_service.py", "python/cli/freeze.py"]
endpoints = ["POST /api/freezes/*", "GET /api/freezes/*"]
cli = ["freeze *"]

[[capability]]
id = "hypothesis-ledger"
title = "Obligation ledger for submitted hypotheses"
group = "verification-chain"
what = """
Decomposes a submitted hypothesis into named obligations (each claim, each consequence, each imported result), checks
that their dependency graph is acyclic, and discharges each one with the strongest exact tool available, leaving the
rest OPEN. It is the standard path behind hypothesis evaluation and the chain.
"""
chain = "Step 5, obligations (M5), and the bookkeeping of step 7, discharge."
files = ["python/discovery/hypothesis_ledger.py"]

[[capability]]
id = "trust-ladder"
title = "Trust ladder"
group = "verification-chain"
what = """
Grades each claim on five rungs, by mechanical rules over recorded evidence: from stated, through formalized and
fidelity-checked, to kernel-checked. A paper is not "formalized" as a whole; each claim has its own rung, and a
roll-up takes the weakest link.
"""
chain = "Step 8, trust ladder (M7)."
files = ["python/discovery/formal_trust.py", "python/discovery/trust_ladder.py"]
endpoints = ["POST /api/trust/assess"]
cli = ["formal trust"]

# --------------------------------------------------------------------------------------------- statement audits

[[capability]]
id = "statement-fidelity"
title = "Statement fidelity and Lean junk-value lint"
group = "statement-audits"
what = """
Asks whether a formal statement asserts what the paper claims. `compare` decides with z3 whether the formal range of a
theorem is stronger, weaker or equal to the paper's range. `lean-lint` lists every place in a Lean statement where
Mathlib's convention of returning a default ("junk") value for undefined operations could make the statement weaker
than it reads. The vacuity probe looks for trivial witnesses that would make a statement say less than its title.
"""
chain = "Step 3, fidelity (M1), when a fidelity specification is supplied."
caveats = [
  "Needs the paper's intended range or statement as input; it cannot read the paper itself.",
  "The lint is syntactic: it lists sites to inspect, not proven defects.",
]
