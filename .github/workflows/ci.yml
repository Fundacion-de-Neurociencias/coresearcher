name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  # Pinned so that lint results do not change when a new tool release ships.
  RUFF_VERSION: "0.11.6"
  BLACK_VERSION: "25.1.0"

jobs:
  lint:
    name: Lint, format and English policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install lint tools
        run: pip install "ruff==${RUFF_VERSION}" "black==${BLACK_VERSION}"
      - name: Ruff (tests and api)
        run: ruff check tests/ api/
      - name: Black (tests and api)
        run: black --check tests/ api/
      - name: English language policy
        run: python scripts/enforce_english_policy.py

  repo-consistency:
    name: Documentation, configuration and API contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install runtime dependencies
        run: pip install -r requirements.txt
      - name: README, pyproject, package.json and .env.example agree
        run: python scripts/check_repo_consistency.py
      - name: OpenAPI contract and API reference are up to date
        run: |
          python scripts/export_openapi.py --check
          python scripts/generate_api_reference.py --check
          python scripts/generate_module_maturity.py --check
          python scripts/compute_confidence_intervals.py --check

  tests:
    name: Test suite
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx jsonschema
      - name: Run pytest
        run: python -m pytest tests/ -v --durations=10

  oase-conformance:
    # OASE (GoogleCloudPlatform/LifeSciences, Apache 2.0) imports fcntl, so the adapter's integration
    # tests run here, on Linux, against OASE at the pinned commit (ADR-DISCOVERY-069).
    name: OASE conformance (formal adapter at the pinned OASE commit)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Clone OASE, apply the adapter, run OASE's checks and conformance tests, then ours
        run: bash integrations/oase/ci/conformance.sh
