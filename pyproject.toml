[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coresearcher"
version = "4.1.0"
description = "Autonomous Epistemic Discovery and Scientific Audit Engine"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Fundación de Neurociencias", email = "info@fneurociencias.org" }
]
keywords = [
    "epistemic-audit",
    "falsification",
    "scientific-discovery",
    "formal-verification"
]
dependencies = [
    "fastapi>=0.110.0",
    "pydantic>=2.7.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "pandas>=2.2.0",
    "uvicorn>=0.29.0",
    "z3-solver>=4.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "black>=24.0.0",
    "mypy>=1.9.0",
    "pre-commit>=3.7.0",
]
deep = [
    "torch>=2.2.0",
]

[project.scripts]
coresearcher = "python.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["python*", "api*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers -ra"
markers = [
    "fast: Fast in-memory unit tests",
    "slow: Tests with extensive numerical or combinatorial processing",
    "epistemic: Tests exercising epistemic engines and courts",
    "api: Tests invoking REST endpoints via TestClient",
    "policy: Compliance and language governance tests",
]
filterwarnings = [
    "ignore::DeprecationWarning:starlette.*",
    "ignore::DeprecationWarning:httpx.*",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E402"]

[tool.black]
line-length = 120
target-version = ["py311", "py312", "py313"]

[tool.mypy]
python_version = "3.12"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
follow_imports = "silent"
exclude = [
    "build/",
    "dist/",
    "node_modules/",
    "data/",
]
