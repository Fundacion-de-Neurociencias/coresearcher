name: CI - Code Quality & Scientific Verifier

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Code Quality & English Policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Lint & Quality Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff black

      - name: Ruff Linter Verification
        run: python -m ruff check tests/

      - name: Black Formatting Verification
        run: python -m black --check tests/

      - name: English Language Policy Verification
        run: python scripts/enforce_english_policy.py

  pytest-suite:
    name: Pytest Verification Suite
    runs-on: ubuntu-latest
    needs: quality-gate
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx

      - name: Run Pytest Test Suite
        run: |
          python -m pytest tests/ -v --durations=10
