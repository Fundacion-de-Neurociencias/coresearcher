# Action Schema - Scientific Execution
# The fundamental verifiable unit

type: object
required: [id, question_id, executed_at, provenance]

properties:
  id:
    type: string
    pattern: "^ACTION-[0-9]{6}$"
    example: "ACTION-000042"
    
  question_id:
    type: string
    pattern: "^QUESTION-[0-9]{6}$"
    description: "Source question this action addresses"
    
  description:
    type: string
    description: "What was done"
    example: "Literature extraction on Alzheimer biomarkers"
    
  inputs:
    type: array
    items:
      type: string
    description: "Input references (claims, other actions)"
    
  outputs:
    type: array
    items:
      type: string
    description: "Generated artifacts (claims, findings)"
    
  executed_at:
    type: string
    format: date-time
    
  executed_by:
    type: string
    description: "Agent or researcher ID"
    
  provenance:
    type: object
    properties:
      model:
        type: string
      prompt:
        type: string
      tools:
        type: array
      code_version:
        type: string
      data_sources:
        type: array