# Clasificación en 3 Niveles de Identidades y Aislamiento de Radio de Impacto (NEUROOS IDENTITY TIERS)
$schema: "http://json-schema.org/draft-07/schema#"
version: "1.1.0"
governance: "Blast Radius Containment & Identity Tiering Architecture"
status: "Inviolable Canonical Reference"

description: >
  Especificación de la clasificación de identidades a 3 niveles (SOVEREIGN, OPERATIONAL, AUTOMATION) 
  y la matriz de aislamiento de radio de impacto para NeuroOS.

identity_tiers:

  # Nivel 1: SOVEREIGN (Exclusivo de Manuel - Fuera de NeuroOS)
  sovereign:
    name: "Identidad Soberana (Root of Trust / Pasaporte Digital)"
    owner: "Manuel (Persona Física)"
    neuroos_access: false
    accessible_by_manuel_runtime: false
    accessible_by_antigravity: false
    blast_radius: "INMUNE - Cero exposición ante cualquier fallo o brecha de NeuroOS"
    assets:
      - "manuelmenendez@gmail.com (Personal Google Root)"
      - "Mobile Root Identity (iPhone / Android / SMS / Hardware Authenticators)"
      - "Microsoft Root Identity (Office 365 / Outlook Personal)"
      - "GitHub Owner Account & Owner Recovery"
      - "Google Authenticator / Root MFA"
      - "YubiKey FIDO2 Hardware Keys"
      - "Bitwarden Master Password Vault"
      - "Certificados Digitales FNMT / DNIe"
      - "Sistema Cl@ve / Identidad Fiscal AEAT"

  # Nivel 2A: CRITICAL_OPERATIONAL (Entornos Sanitarios e Institucionales Restringidos)
  critical_operational:
    name: "Identidades Operativas Críticas (HUCA / Datos Sanitarios)"
    owner: "Manuel"
    neuroos_access: true
    accessible_by_manuel_runtime: true
    accessible_by_antigravity: "Muy Restringido (Sin procesamiento de datos clínicos por LLM en nube)"
    blast_radius: "ALTO RIESGO REGULATORIO - Restricción estricta HIPAA/GDPR"
    assets:
      - "Correo Corporativo HUCA Neurología (huca_clinical_ops)"
      - "Sistemas Corporativos Sanitarios"

  # Nivel 2B: OPERATIONAL (Manejo Mediado por ManuEl)
  operational:
    name: "Identidades Operativas de Trabajo General"
    owner: "Manuel"
    neuroos_access: true
    accessible_by_manuel_runtime: true
    accessible_by_antigravity: "Mediado (Vía Leases / Puertas de Aprobación)"
    blast_radius: "LIMITADO - Daño acotado a cuentas de trabajo secundarias"
    assets:
      - "Correo Universidad de Oviedo (manuel.menendez@uniovi.es)"
      - "Correo Fundación (fundacion@neurociencias.org)"
      - "Correo ISPA / FINBA"
      - "Cuentas de Subvenciones ERC"
      - "Calendario Unificado de Trabajo"
      - "Plataformas de Viajes (Booking / Transportes)"

  # Nivel 3: AUTOMATION (Manejo Autónomo por Antigravity / Subagentes)
  automation:
    name: "Identidades de Automatización y Bots de Sistema"
    owner: "NeuroOS System"
    neuroos_access: true
    accessible_by_manuel_runtime: true
    accessible_by_antigravity: true
    blast_radius: "EFÍMERO - Cuentas dedicadas exclusivamente a tareas automáticas"
    assets:
      - "neuroos-bot@domain.org"
      - "automation@medicalia.org"
      - "ci-cd-agent@domain.org"
      - "github-actions-bot"

# Matriz Resumen de Accesibilidad por Componente
accessibility_matrix:
  - asset: "Gmail Personal Principal (manuelmenendez@gmail.com)"
    tier: "SOVEREIGN"
    access_manuel_human: true
    access_manuel_runtime: false
    access_antigravity: false

  - asset: "Mobile Root Identity (iPhone/Android/SMS)"
    tier: "SOVEREIGN"
    access_manuel_human: true
    access_manuel_runtime: false
    access_antigravity: false

  - asset: "GitHub Owner Account"
    tier: "SOVEREIGN"
    access_manuel_human: true
    access_manuel_runtime: false
    access_antigravity: false

  - asset: "Microsoft Root Identity"
    tier: "SOVEREIGN"
    access_manuel_human: true
    access_manuel_runtime: false
    access_antigravity: false

  - asset: "Correo HUCA Neurología Ops"
    tier: "CRITICAL_OPERATIONAL"
    access_manuel_human: true
    access_manuel_runtime: true
    access_antigravity: "Muy restringido (Sin LLM nube)"

  - asset: "Email Universidad (Uniovi)"
    tier: "OPERATIONAL"
    access_manuel_human: true
    access_manuel_runtime: true
    access_antigravity: "Según tareas (Approval Gate)"

  - asset: "Email Fundación"
    tier: "OPERATIONAL"
    access_manuel_human: true
    access_manuel_runtime: true
    access_antigravity: "Según tareas (Approval Gate)"

  - asset: "Repositorios de Proyectos (Medicalia, GeneForge, etc.)"
    tier: "AUTOMATION"
    access_manuel_human: true
    access_manuel_runtime: true
    access_antigravity: "Sí (Autónomo)"
