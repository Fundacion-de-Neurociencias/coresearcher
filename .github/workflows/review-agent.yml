name: Review Agent - Quality Assessment

on:
  workflow_dispatch:
    inputs:
      artifact:
        description: 'Artifact to review (claims.json, etc.)'
        required: true

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Load artifact
        run: |
          # Load the artifact to review
          ARTIFACT='${{ inputs.artifact }}'
          echo "Reviewing: $ARTIFACT"
          
      - name: Execute review
        id: review_action
        run: |
          python -c "
          import json
          from datetime import datetime
          
          # Simulate review scoring
          scores = {
            'methodological': 0.85,
            'evidence': 0.78,
            'logical': 0.82
          }
          
          overall = sum(scores.values()) / len(scores)
          
          result = {
            'action_id': 'ACTION-' + datetime.now().strftime('%Y%m%d%H%M%S'),
            'type': 'REVIEW_VALIDATION',
            'actor': 'review-agent',
            'target': '${{ inputs.artifact }}',
            'scores': scores,
            'overall': round(overall, 2),
            'recommendation': 'ACCEPT' if overall > 0.7 else 'REVISE',
            'timestamp': datetime.utcnow().isoformat()
          }
          
          # Write to actions log
          with open('actions/${{ steps.review_action.outputs.action_id }}.json', 'w') as f:
            json.dump(result, f, indent=2)
            
          print(f'::set-output name=action_id::{result[\"action_id\"]}')
          "

      - name: Update review scores artifact
        run: |
          # Append review to review-scores.json
          python -c "
          import json
          from datetime import datetime
          
          review = {
            'action_id': '${{ steps.review_action.outputs.action_id }}',
            'overall': 0.82,
            'recommendation': 'ACCEPT',
            'timestamp': datetime.utcnow().isoformat()
          }
          
          try:
            with open('artifacts/review-scores.json', 'r') as f:
              scores = json.load(f)
          except:
            scores = []
            
          scores.append(review)
          
          with open('artifacts/review-scores.json', 'w') as f:
            json.dump(scores, f, indent=2)
          "

      - name: Commit results
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Add review ACTION-${{ steps.review_action.outputs.action_id }}"
          file_pattern: "actions/artifacts/"