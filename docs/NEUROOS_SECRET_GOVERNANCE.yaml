# Arquitectura de Gestión de Secretos y Credenciales de NeuroOS (NEUROOS SECRET GOVERNANCE)
$schema: "http://json-schema.org/draft-07/schema#"
version: "1.0.0"
governance: "Root of Trust & Vault Secret Architecture"
status: "Canonical Reference"

description: >
  Especificación de la arquitectura de bóveda (Vault), referencias de secretos, 
  leases de credenciales temporales y separación del plano de autoridad de secretos.

vault_architecture:
  provider: "Bitwarden / Infisical Central Vault"
  location: "Nodo Lenovo (ManuEl Sovereign Runtime)"
  secret_storage_policy: "Prohibida la presencia de secretos en texto plano o archivos .env en repositorios."

# 1. Matriz de Autorización de Uso de Secretos
secret_permissions_matrix:
  # Secretos Raíz (Root of Trust) - Nivel 0 Solo Manuel
  FNMT_Certificate:
    root_owner: "Manuel"
    vault_ref: "vault://root/fnmt_cert"
    usable_by_manuel_runtime: false
    usable_by_antigravity: false
    delegable: false
    leaseable: false
    storage_type: "Hardware Token / YubiKey / DNIe"

  Clave_Credentials:
    root_owner: "Manuel"
    vault_ref: "vault://root/clave"
    usable_by_manuel_runtime: false
    usable_by_antigravity: false
    delegable: false
    leaseable: false

  Master_Password_Vault:
    root_owner: "Manuel"
    vault_ref: "vault://root/master_key"
    usable_by_manuel_runtime: false
    usable_by_antigravity: false
    delegable: false
    leaseable: false

  Seed_Phrases_Crypto:
    root_owner: "Manuel"
    vault_ref: "vault://root/seed_phrases"
    usable_by_manuel_runtime: false
    usable_by_antigravity: false
    delegable: false
    leaseable: false

  # Secretos Mediados - Nivel 1 ManuEl / Nivel 2 Antigravity (vía Lease de Credencial)
  GitHub_UQG_Token:
    root_owner: "Manuel"
    vault_ref: "vault://github/uqg"
    usable_by_manuel_runtime: false
    usable_by_antigravity: false
    delegable: false
    leaseable: false

  GitHub_Medicalia_Token:
    root_owner: "Manuel"
    vault_ref: "vault://github/medicalia"
    usable_by_manuel_runtime: true
    usable_by_antigravity: true
    delegable: true
    leaseable: true
    max_lease_ttl_seconds: 900 # 15 minutos máximo
    allowed_scopes:
      - "github.pr_create"
      - "github.issue_create"

  GitHub_GeneForge_Token:
    root_owner: "Manuel"
    vault_ref: "vault://github/geneforge"
    usable_by_manuel_runtime: true
    usable_by_antigravity: true
    delegable: true
    leaseable: true
    max_lease_ttl_seconds: 900
    allowed_scopes:
      - "github.pr_create"

  Gmail_Fundacion_OAuth:
    root_owner: "Manuel"
    vault_ref: "vault://email/fundacion"
    usable_by_manuel_runtime: true
    usable_by_antigravity: true
    delegable: true
    leaseable: true
    requires_human_approval_per_use: true
    allowed_scopes:
      - "email.send_approved_draft"

  OpenAI_API_Key:
    root_owner: "Manuel"
    vault_ref: "vault://llm/openai"
    usable_by_manuel_runtime: true
    usable_by_antigravity: true
    delegable: true
    leaseable: true
    max_lease_ttl_seconds: 7200
    allowed_scopes:
      - "llm.inference"

  Gemini_API_Key:
    root_owner: "Manuel"
    vault_ref: "vault://llm/gemini"
    usable_by_manuel_runtime: true
    usable_by_antigravity: true
    delegable: true
    leaseable: true
    max_lease_ttl_seconds: 7200
    allowed_scopes:
      - "llm.inference"

# 2. Reglas del Motor de Leases de Credenciales (Credential Lease Engine)
credential_lease_policy:
  wildcards_prohibited: true # Prohibido emitir scope: "*"
  context_binding_required: true # El lease se vincula al hash del contexto
  automatic_destruction: true # El token temporal se destruye tras la ejecución
