# Grafo de Dependencias de Identidades y Escalada Lateral (NEUROOS IDENTITY DEPENDENCY GRAPH)
$schema: "http://json-schema.org/draft-07/schema#"
version: "1.0.0"
governance: "Identity Dependency & Escalation Graph Architecture"
status: "Canonical Reference"

description: >
  Grafo de dependencias entre las 10-20 Identidades Raíz soberanas de Manuel. 
  Mapea las rutas de recuperación, autenticación SSO y escalada lateral de riesgo.

identity_dependency_graph:

  # 1. Google Personal Root (Nodo Soberano Nivel 0)
  Google_Personal_Root:
    tier: "SOVEREIGN"
    target_assets:
      - "gmail_personal"
      - "google_authenticator"
    downstream_dependents:
      - "GitHub_Owner_Account" (via password reset email)
      - "OpenAI_Billing_Account" (via Google OAuth / email reset)
      - "Vercel_Hosting_Account" (via GitHub / email reset)
      - "Banking_Recovery_Channels" (via email alerts)

  # 2. Mobile Root Identity (Nodo Soberano Nivel 0)
  Mobile_Root_Identity:
    tier: "SOVEREIGN"
    target_assets:
      - "iphone_android_hardware"
      - "sim_card_sms"
    downstream_dependents:
      - "Banking_MFA_SMS"
      - "Google_2FA_Prompt"
      - "Microsoft_Authenticator"
      - "Cl@ve_Pin_SMS"

  # 3. Microsoft Root Identity (Nodo Soberano Nivel 0)
  Microsoft_Root_Identity:
    tier: "SOVEREIGN"
    target_assets:
      - "microsoft_365_master"
      - "outlook_personal"
    downstream_dependents:
      - "uniovi_sso_federation"
      - "onedrive_storage"

  # 4. GitHub Owner Account (Nodo Soberano Nivel 0)
  GitHub_Owner_Account:
    tier: "SOVEREIGN"
    target_assets:
      - "manuel-owner-account"
      - "github_master_orgs"
    downstream_dependents:
      - "github_repos_medicalia" (via owner access)
      - "github_repos_geneforge" (via owner access)
      - "github_pat_issuance" (via master account)

  # 5. FNMT / Cl@ve / Identidad Ciudadana (Nodo Soberano Nivel 0)
  AEAT_Clave_Root:
    tier: "SOVEREIGN"
    target_assets:
      - "dnie_hardware"
      - "yubikey_fnmt"
    downstream_dependents:
      - "aeat_hacienda_portal"
      - "seguridad_social_portal"

  # 6. HUCA Neurología (Nodo Operativo Crítico - Red Hospitalaria)
  HUCA_Hospital_Root:
    tier: "CRITICAL_OPERATIONAL"
    allow_model_processing: false
    target_assets:
      - "huca_email"
      - "intranet_hospital"
    downstream_dependents:
      - "historias_clinicas"

escalation_chain_warning: >
  EL GRAFO DEMUESTRA QUE COMPROMETER GOOGLE PERSONAL ROOT O MOBILE ROOT PERMITE 
  TOMAR CONTROL LATERAL DE GITHUB OWNER, OPENAI, VERCEL Y BANCOS. POR ELLO, DICHOS NODOS 
  SON ZONA BLACK INVIOLABLE FUERA DEL ALCANCE DE NEUROOS.
