# Aislamiento de la Identidad Soberana Personal de Manuel (NEUROOS SOVEREIGN IDENTITY)
$schema: "http://json-schema.org/draft-07/schema#"
version: "1.0.0"
governance: "Digital Sovereignty & Account Recovery Protection"
status: "Inviolable Canonical Reference"

description: >
  Especificación del aislamiento absoluto de la Identidad Soberana Personal de Manuel 
  (`manuelmenendez@gmail.com`) FUERA del alcance de NeuroOS. Separa la Identidad Soberana 
  de las Cuentas Operativas del Sistema.

# 1. Declaración de Identidad Soberana (FUERA DE NEUROOS)
sovereign_identity:
  name: "manuelmenendez@gmail.com"
  type: "Digital Passport / Root of Trust"
  owner: "Manuel (Persona Física)"
  zone: "BLACK"
  managed_by_neuroos: false
  accessible_by_agents: false
  delegable: false
  leaseable: false
  recoverable_only_by: "Manuel (Persona Física)"
  protected_assets:
    - "FIDO2 / YubiKey Hardware Keys"
    - "Google Authenticator Root Keys"
    - "Apple / Microsoft Recovery Accounts"
    - "Bitwarden Master Password Vault"
    - "FNMT / DNIe Digital Certificates"
    - "Cl@ve / AEAT Fiscal Recovery"
    - "Bank Recovery Verification Codes"
    - "GitHub Owner Account Recovery"
  rule: >
    Ningún agente accede. Ningún lease existe. Ninguna excepción. 
    Ni siquiera el runtime ManuEl tiene visibilidad directa ni credenciales de este buzón.

# 2. Arquitectura de 3 Niveles de Identidades

```text
                     ┌────────────────────────────────────────────────────────┐
                     │ MANUEL PERSONA FÍSICA (SOBERANO DIGITAL)              │
                     │ Identidad Soberana: manuelmenendez@gmail.com           │
                     │ (FUERA Y POR ENCIMA DE NEUROOS - ZONA BLACK INVIOLABLE)│
                     └───────────────────────────┬────────────────────────────┘
                                                 │ Reenvío / Filtro
                                                 ▼
┌────────────────────────────────────────────────────────────────────────────────────────┐
│                                   NEUROOS ECOSISTEMA                                  │
│                                                                                        │
│   ┌───────────────────────────────────┐        ┌───────────────────────────────────┐   │
│   │ IDENTIDADES PROFESIONALES         │        │ IDENTIDADES DE SISTEMA & BOTS     │   │
│   │ (Automatización Limitada)         │        │ (Automatización Amplia)           │   │
│   ├───────────────────────────────────┤        ├───────────────────────────────────┤   │
│   │ • fundacion@neurociencias.org     │        │ • automation@medicalia.org        │   │
│   │ • manuel.menendez@uniovi.es       │        │ • neuroos-bot@domain.org          │   │
│   │ • huca_neurologia_ops             │        │ • ci-cd-agent@domain.org          │   │
│   └───────────────────────────────────┘        └───────────────────────────────────┘   │
└────────────────────────────────────────────────────────────────────────────────────────┘
```

# 3. Patrón de Reenvío y Aislamiento de Daño
operational_forwarding_pattern:
  description: >
    El correo entrante en `manuelmenendez@gmail.com` se clasifica mediante filtros 
    automatizados de proveedor (Google Workspace / Gmail Rules) y se reenvía a las 
    cuentas operativas correspondientes (`fundacion@...`, `uniovi@...`). 
    NeuroOS opera exclusivamente sobre las cuentas operativas.

  damage_containment_guarantee: >
    Si un agente se equivoca, compromete un token o borra datos en una cuenta operativa, 
    el usuario pierde una cuenta de trabajo aislada. JAMÁS pierde su Identidad Digital 
    Soberana, su capacidad de recuperación de contraseñas, su acceso a bancos ni su 
    personalidad legal.
