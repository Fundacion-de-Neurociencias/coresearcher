# --------------------------------------------------------------------------------------------- infrastructure

[[capability]]
id = "api-server"
adrs = ["ADR-DISCOVERY-009"]
title = "API server, security and request schemas"
group = "infrastructure"
what = """
Assembles the FastAPI application from the routers: CORS, rate limiting, API-key authentication for state-modifying
endpoints, HMAC verification of webhooks, and the request models. `/api/health` reports the service and the demo
state's size.
"""
files = ["api/server.py", "api/security.py", "api/schemas.py", "api/testing.py"]
endpoints = ["GET /api/health"]

[[capability]]
id = "cli-shell"
title = "CLI shell"
group = "infrastructure"
what = "The `coresearcher` command: `serve` starts the API, `test` runs the test suite, `info` prints the configuration."
caveats = ["`info` lists older engines (holonomy auditor, reality firewall, adversarial engine) as 'core engines active'; see their caveats above."]
files = ["python/cli/main.py"]
cli = ["serve", "test", "info"]

[[capability]]
id = "research-lifecycle"
title = "Research lifecycle and stage gates"
group = "infrastructure"
what = """
Moves a research project through fixed stages (question, hypothesis, protocol, execution, controls, analysis, report),
each closed by a gate whose checks are of four kinds: verifier, human, artifact and rubric. Whoever produced a result
cannot certify it. Events are hash-chained and replayable; a watcher reports stalled stages and changed artifacts; a
release says whether the work was pre-registered or exploratory; OnTrack ingests the projects.
"""
caveats = [
  "The verifier role is declared by the caller over the API; no module submits verifier results by itself yet.",
  "Human sign-offs are optional since 2026-10-17 and reported in release notes (claims register row 26).",
]
files = ["python/discovery/research_lifecycle.py"]
endpoints = [
  "* /api/lifecycle/projects",
  "* /api/lifecycle/projects/{project_id}",
  "* /api/lifecycle/projects/{project_id}/gate*",
  "POST /api/lifecycle/projects/{project_id}/re*",
  "GET /api/lifecycle/template",
  "GET /api/lifecycle/watch",
  "GET /api/lifecycle/ontrack",
]

[[capability]]
id = "research-packages"
title = "Research packages"
group = "infrastructure"
what = """
One file that carries a lifecycle project to another machine: its event log, every artifact, a README and RO-Crate
metadata. Packages can be exported, verified without importing, and forked; tampering, silent omissions and forged
gates are refused. Published packages are served byte for byte.
"""
files = ["python/discovery/research_package.py", "scripts/research_package.py", "scripts/packages/*"]
endpoints = ["* /api/lifecycle/packages*", "GET /api/lifecycle/projects/{project_id}/package"]

